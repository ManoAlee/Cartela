<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="10"/>

  <!-- Subtle inner combinatorial lattice lines -->
  <path d="M148 188 H364 M148 324 H364 M148 188 V324 M256 188 V324 M364 188 V324"
        stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>

  <!-- Row 1: 2x3 Combinatorial Matrix Nodes -->
  <circle cx="148" cy="188" r="34" fill="#1E293B" stroke="#334155" stroke-width="6"/>
  <circle cx="256" cy="188" r="34" fill="url(#emeraldGrad)"/>
  <circle cx="364" cy="188" r="38" fill="url(#goldGrad)"/>

  <!-- Row 2 -->
  <circle cx="148" cy="324" r="34" fill="url(#emeraldGrad)"/>
  <circle cx="256" cy="324" r="34" fill="#1E293B" stroke="#334155" stroke-width="6"/>
  <circle cx="364" cy="324" r="34" fill="url(#emeraldGrad)"/>
</svg>
