[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cartela"
version = "2.0.0"
authors = [
  { name="Alessandro Meneses", email="alessandro.meneses@Enterprise.com" },
]
description = "Advanced Mathematical Lottery Intelligence Lab — Game Theory, Covering Designs C(v,k,t), Joan Ginther Arbitrage and NIST SP 800-22 Randomness Audit"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "fpdf2>=2.7.0",
    "numpy>=1.24.0",
]

[project.urls]
"Homepage" = "https://github.com/ManoAlee/Cartela"
"Bug Tracker" = "https://github.com/ManoAlee/Cartela/issues"

[project.scripts]
cartela = "app_files.src.app.gui:main"
