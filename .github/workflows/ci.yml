name: Cartela CI Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bytecode Compilation Check
        run: |
          python -m compileall -q .

      - name: Compile C# Native Kernel & WPF UI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set CSC=C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          set WPF=C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF
          "%CSC%" /nologo /unsafe /optimize+ /platform:x64 /out:app_files\src\core\cartela_kernel.exe app_files\src\core\native_kernel.cs
          "%CSC%" /nologo /target:winexe /unsafe /optimize+ /platform:x64 /win32icon:app_files\assets\cartela_logo.ico /r:"%WPF%\PresentationFramework.dll" /r:"%WPF%\PresentationCore.dll" /r:"%WPF%\WindowsBase.dll" /r:"C:\Windows\Microsoft.NET\Framework64\v4.0.30319\System.Xaml.dll" /r:"C:\Windows\Microsoft.NET\Framework64\v4.0.30319\System.Web.Extensions.dll" /out:CartelaUI.exe app_files\src\ui_csharp\CartelaUI.cs

      - name: Run Formal Mathematical Test Suite
        run: |
          python -m unittest discover -v tests
